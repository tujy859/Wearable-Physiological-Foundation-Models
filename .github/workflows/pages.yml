name: Publish research catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        id: pages
        uses: actions/configure-pages@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependency
        run: python -m pip install -r scripts/requirements-site.txt
      - name: Check generated tables and Markdown
        run: |
          python scripts/build_tables.py --check
          python scripts/lint_md.py --errors-only
      - name: Build and check catalog
        env:
          CATALOG_REPOSITORY: ${{ github.repository }}
          CATALOG_BRANCH: ${{ github.event.repository.default_branch }}
          CATALOG_SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          python scripts/build_site.py
          python scripts/check_site.py
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy catalog
        id: deployment
        uses: actions/deploy-pages@v5
